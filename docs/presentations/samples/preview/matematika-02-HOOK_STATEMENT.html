<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Slide Preview</title></head>
<body style="margin:0;"><div xmlns="http://www.w3.org/1999/xhtml" class="root">
    <style>
    .root {
      width: 1280px; height: 720px;
      position: relative; overflow: hidden;
      font-family: "Segoe UI", "Poppins", Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(900px 500px at 85% -10%, #6366f1 0%, transparent 55%),
        radial-gradient(700px 600px at -10% 110%, #3730a3 0%, transparent 60%),
        linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
      display: flex; flex-direction: column;
      padding: 48px 64px;
      box-sizing: border-box;
    }
    .root * { box-sizing: border-box; margin: 0; padding: 0; }
    .blob { position: absolute; border-radius: 50%; pointer-events: none; }
    .blob-a {
      width: 420px; height: 420px; top: -160px; right: -120px;
      background: radial-gradient(circle at 50% 50%, #6366f166 0%, #6366f122 45%, transparent 70%);
    }
    .blob-b {
      width: 460px; height: 460px; bottom: -200px; left: -140px;
      background: radial-gradient(circle at 50% 50%, #6366f144 0%, #6366f118 45%, transparent 70%);
    }
    .deco-layer { position: absolute; inset: 0; pointer-events: none; }

    .topbar { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(165, 180, 252, 0.16); color: #a5b4fc;
      border: 1px solid rgba(165, 180, 252, 0.16);
      padding: 7px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .pageinfo { font-size: 14px; color: #a5b4fc; font-weight: 600; opacity: 0.9; }

    .footer {
      margin-top: auto; display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; color: rgba(255,255,255,0.55); position: relative; z-index: 3;
      border-top: 1px solid rgba(255,255,255,0.12); padding-top: 16px;
    }
    .footer b { color: rgba(255,255,255,0.82); font-weight: 700; }

    .kicker {
      font-size: 17px; font-weight: 700; color: #a5b4fc;
      letter-spacing: 0.5px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .kicker::before { content: ""; width: 34px; height: 4px; border-radius: 4px; background: #a5b4fc; }
    .content-area { position: relative; z-index: 3; display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* Visual side panel (only rendered when the slide has a visual prompt) */
    .visual-panel {
      width: 34%; flex-shrink: 0; border-radius: 22px; overflow: hidden;
      background: linear-gradient(160deg, rgba(165, 180, 252, 0.16) 0%, rgba(255,255,255,0.05) 100%);
      border: 1.5px solid rgba(255,255,255,0.18);
      display: flex; flex-direction: column;
      box-shadow: 0 14px 34px rgba(0,0,0,0.24);
    }
    .visual-panel img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .visual-fallback { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 20px; text-align: center; }
    .visual-icon {
      width: 64px; height: 64px; border-radius: 20px; font-size: 32px;
      background: rgba(255,255,255,0.10); border: 1.5px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .visual-label { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #a5b4fc; }
    .visual-desc { font-size: 13.5px; line-height: 1.5; color: rgba(255,255,255,0.78); }

    .hl { color: #a5b4fc; }
  
      .hook-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 3; }
      .hook-mark { font-size: 120px; line-height: 0.6; color: #a5b4fc; opacity: 0.9; font-family: Georgia, serif; margin-bottom: 8px; }
      .hook-title { font-size: 30px; font-weight: 700; color: rgba(255,255,255,0.85); margin-bottom: 18px; }
      .hook-statement { font-size: 46px; font-weight: 800; line-height: 1.25; max-width: 1080px; }
      .hook-support { margin-top: 26px; font-size: 20px; color: rgba(255,255,255,0.72); max-width: 900px; line-height: 1.55; }
    </style>
    
        <div class="deco-layer" style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 44px 44px;"></div>
        <div class="deco-layer">
          <div class="blob" style="border: 2px solid rgba(255,255,255,0.14); background: transparent; width: 120px; height: 120px; top: 130px; right: 90px;"></div>
          <div class="blob" style="width: 0; height: 0; border-left: 45px solid transparent; border-right: 45px solid transparent; border-bottom: 80px solid rgba(255,255,255,0.10); bottom: 110px; right: 230px; transform: rotate(18deg); border-radius: 0;"></div>
          <div class="blob" style="border: 2px solid rgba(255,255,255,0.12); background: transparent; width: 70px; height: 70px; top: 210px; right: 300px; transform: rotate(24deg);"></div>
        </div>
    
    <div class="topbar">
      <span class="badge">📐 Pertanyaan Pemantik</span>
      <span class="pageinfo">Slide 2 / 9</span>
    </div>
    <div class="hook-wrap">
      <div class="hook-mark">&#8220;</div>
      <div class="hook-title">Pertanyaan Pemantik</div>
      <div class="hook-statement">Mengapa berhenti <span class="hl">5 detik</span> saja, jantungmu sudah memberi alarm?</div>
      <div class="hook-support">Coba rasakan denyut nadimu sekarang. Berapa kali jantungmu berdetak sejak pagi tadi?</div>
    </div>
    <div class="footer"><span>🏫 <b>SMP Negeri 1 Contoh</b> <span style='opacity:.5'>·</span> <b>Kelas VIII-B</b></span><span>👨‍🏫 <b>Bapak Guru</b> <span style='opacity:.5'>·</span> <b>Matematika</b></span></div></div></body>
</html>

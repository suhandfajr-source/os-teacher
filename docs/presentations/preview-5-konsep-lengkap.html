<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Preview: 5 Konsep UI/UX Klassa OS Teacher (Beranda, AI Studio & Workspace Kelas)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            teal: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              200: '#99F6E4',
              300: '#5EEAD4',
              400: '#2DD4BF',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
              900: '#134E4A',
              950: '#042F2E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.02);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(15,118,110,0.25);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(15,118,110,0.45);
    }
    .tactile-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-btn:active {
      transform: scale(0.96);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }
  </style>
</head>
<body id="app-body" class="bg-[#F6F8F8] text-slate-800 min-h-screen flex flex-col custom-scrollbar">

  <!-- ========================================================================= -->
  <!-- TOP DUAL-LEVEL CONTROL BAR -->
  <!-- ========================================================================= -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/90 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- LEVEL 1: BRAND + 5 CONCEPTS SWITCHER -->
      <div class="py-2.5 flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-800 via-teal-700 to-teal-500 flex items-center justify-center text-white shadow-xs">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-sm tracking-tight text-slate-900">KLASSA</span>
              <span class="px-1.5 py-0.2 rounded text-[9px] font-extrabold uppercase bg-teal-100 text-teal-800 border border-teal-200">BMad Master Suite</span>
            </div>
            <p class="text-[10px] text-slate-500 font-medium">5 Varian Konsep UI Multi-Generasi</p>
          </div>
        </div>

        <!-- 5 CONCEPTS SELECTOR BUTTONS -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0 custom-scrollbar" id="concept-tabs">
          <button onclick="changeConcept(1)" id="c-btn-1" class="concept-tab-btn active px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-teal-700 text-white shadow-xs">
            ⚡ 1. Edu-OS
          </button>
          <button onclick="changeConcept(2)" id="c-btn-2" class="concept-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-slate-100 hover:bg-slate-200 text-slate-700">
            🎨 2. Warm Bento
          </button>
          <button onclick="changeConcept(3)" id="c-btn-3" class="concept-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-slate-100 hover:bg-slate-200 text-slate-700">
            🚀 3. Focus Flow
          </button>
          <button onclick="changeConcept(4)" id="c-btn-4" class="concept-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-slate-100 hover:bg-slate-200 text-slate-700">
            🌐 4. Tri-Persona
          </button>
          <button onclick="changeConcept(5)" id="c-btn-5" class="concept-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-slate-100 hover:bg-slate-200 text-slate-700">
            ✨ 5. AI Glass
          </button>
        </div>
      </div>

      <!-- LEVEL 2: 3 CORE SCREENS SWITCHER (Beranda, AI Studio, Workspace Kelas) -->
      <div class="py-2 flex items-center justify-between gap-3 overflow-x-auto custom-scrollbar">
        <div class="flex items-center gap-1 sm:gap-2">
          <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mr-1 hidden sm:inline">Pilih Halaman:</span>
          
          <button onclick="changeScreen('beranda')" id="s-btn-beranda" class="screen-tab-btn active px-3.5 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all tactile-btn bg-teal-50 border border-teal-200 text-teal-800">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5 text-teal-700"></i>
            <span>1. Beranda Guru</span>
          </button>

          <button onclick="changeScreen('aistudio')" id="s-btn-aistudio" class="screen-tab-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 border border-transparent">
            <i data-lucide="wand-2" class="w-3.5 h-3.5 text-indigo-600"></i>
            <span>2. AI Studio</span>
          </button>

          <button onclick="changeScreen('kelas')" id="s-btn-kelas" class="screen-tab-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 border border-transparent">
            <i data-lucide="book-open-check" class="w-3.5 h-3.5 text-teal-700"></i>
            <span>3. Workspace Kelas (VIII-A)</span>
          </button>
        </div>

        <!-- Concept Persona Quick Rationale Badge -->
        <div id="concept-rationale-badge" class="hidden lg:flex items-center gap-1.5 text-xs text-slate-600 font-medium">
          <!-- Dynamic info text injected by JS -->
        </div>
      </div>

    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- MAIN DYNAMIC CONTENT ROOT -->
  <!-- ========================================================================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6" id="main-render-root">
    <!-- Dynamic Screens Injected Here -->
  </main>

  <!-- ========================================================================= -->
  <!-- FOOTER -->
  <!-- ========================================================================= -->
  <footer class="bg-white border-t border-slate-200 py-5 text-center text-xs text-slate-500 mt-12">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="font-extrabold text-slate-800">Klassa BMad Multi-Concept Suite</span>
        <span>•</span>
        <span>Dirancang Khusus Guru (23-45th), Ortu (30-45th) & Siswa (SD-SMA)</span>
      </div>
      <p class="text-slate-400 text-[11px]">Next.js 16 • Tailwind CSS v4 • Gemini 2.5 Flash</p>
    </div>
  </footer>

  <!-- ========================================================================= -->
  <!-- MASTER SCRIPT: 5 CONCEPTS × 3 SCREENS ENGINE -->
  <!-- ========================================================================= -->
  <script>
    let activeConcept = 1; // 1 to 5
    let activeScreen = 'beranda'; // 'beranda', 'aistudio', 'kelas'

    // CONCEPT METADATA
    const CONCEPTS_DATA = {
      1: {
        name: "Modern Edu-OS & Command Center",
        theme: "teal-linear",
        bodyBg: "#F6F8F8",
        badge: "⚡ Linear & Raycast Style • Kecepatan Kerja < 5 dtk",
        rationale: "Fokus guru muda & senior produktif: dense table, quick attendance pills, keyboard shortcuts."
      },
      2: {
        name: "Warm Bento Grid & Humanist Story",
        theme: "warm-bento",
        bodyBg: "#FBFBFA",
        badge: "🎨 Apple Edu & Notion Style • Ramah Emosional & Ortu",
        rationale: "Fokus orang tua & elementary school: kartu asimetris organik, visual santun tanpa stres."
      },
      3: {
        name: "Focus Flow & Live Mode Shifter",
        theme: "focus-flow",
        bodyBg: "#F8FAFC",
        badge: "🚀 Duolingo & Cockpit Style • Mode 1 Live Jumbo Buttons",
        rationale: "Fokus mengajar langsung di kelas nyata: tombol jempol 56px, timer interaktif & kuis seru."
      },
      4: {
        name: "Tri-Persona Adaptive Portal",
        theme: "tri-persona",
        bodyBg: "#F6F8F8",
        badge: "🌐 Super-App 3-in-1 • Guru / Ortu / Siswa",
        rationale: "Fokus pemisahan peran: Cockpit Guru, WhatsApp feed Ortu, Misi Belajar Siswa."
      },
      5: {
        name: "Smart AI Co-Pilot & Fluid Glass",
        theme: "ai-glass",
        bodyBg: "#0B0F19",
        badge: "✨ Perplexity & Arc Style • Omnibar AI Prompt Melayang",
        rationale: "Fokus otomatisasi masa depan: generate RPP/Kuis dari bahasa alami seketika."
      }
    };

    // SWITCH CONCEPT
    function changeConcept(cId) {
      activeConcept = cId;
      document.querySelectorAll('.concept-tab-btn').forEach((btn, idx) => {
        if (idx + 1 === cId) {
          btn.className = "concept-tab-btn active px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-teal-700 text-white shadow-xs";
        } else {
          btn.className = "concept-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap tactile-btn bg-slate-100 hover:bg-slate-200 text-slate-700";
        }
      });
      document.getElementById('app-body').style.backgroundColor = CONCEPTS_DATA[cId].bodyBg;
      document.getElementById('concept-rationale-badge').innerHTML = `
        <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-[10px] font-bold border border-slate-200">
          ${CONCEPTS_DATA[cId].badge}
        </span>
      `;
      renderActiveView();
    }

    // SWITCH SCREEN
    function changeScreen(screenId) {
      activeScreen = screenId;
      document.querySelectorAll('.screen-tab-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-teal-50', 'border-teal-200', 'text-teal-800');
        btn.classList.add('text-slate-600', 'border-transparent');
      });
      const current = document.getElementById('s-btn-' + screenId);
      if (current) {
        current.classList.add('active', 'bg-teal-50', 'border-teal-200', 'text-teal-800');
        current.classList.remove('text-slate-600', 'border-transparent');
      }
      renderActiveView();
    }

    // RENDER DISPATCHER
    function renderActiveView() {
      const root = document.getElementById('main-render-root');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Concept Banner
      let bannerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-2xl bg-white border border-slate-200/90 shadow-2xs">
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-teal-700 text-white font-extrabold text-xs flex items-center justify-center">
              C${activeConcept}
            </span>
            <div>
              <h2 class="text-sm font-extrabold text-slate-900">${CONCEPTS_DATA[activeConcept].name}</h2>
              <p class="text-[11px] text-slate-500">${CONCEPTS_DATA[activeConcept].rationale}</p>
            </div>
          </div>
          <span class="text-xs font-bold text-teal-800 bg-teal-50 px-3 py-1 rounded-full border border-teal-200 self-start sm:self-auto">
            Halaman Aktif: ${activeScreen === 'beranda' ? '1. Beranda Guru' : activeScreen === 'aistudio' ? '2. AI Studio' : '3. Workspace Kelas'}
          </span>
        </div>
      `;

      let contentHTML = "";

      if (activeConcept === 1) {
        contentHTML = renderConcept1();
      } else if (activeConcept === 2) {
        contentHTML = renderConcept2();
      } else if (activeConcept === 3) {
        contentHTML = renderConcept3();
      } else if (activeConcept === 4) {
        contentHTML = renderConcept4();
      } else if (activeConcept === 5) {
        contentHTML = renderConcept5();
      }

      root.innerHTML = bannerHTML + contentHTML;
      lucide.createIcons();
    }

    // =========================================================================
    // 1. CONCEPT 1 BUILDER (Modern Edu-OS & Command Center)
    // =========================================================================
    function renderConcept1() {
      if (activeScreen === 'beranda') {
        return `
          <div class="space-y-5 animate-fadeIn">
            <!-- Command Bar Header -->
            <div class="p-5 rounded-3xl bg-teal-900 text-white shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="space-y-1">
                <span class="text-[10px] font-extrabold uppercase tracking-wider bg-teal-800 text-teal-200 px-2.5 py-0.5 rounded-full">OS Teacher v3 Dashboard</span>
                <h3 class="text-xl font-extrabold">Selamat Pagi, Pak Budi (Guru Matematika)</h3>
                <p class="text-xs text-teal-100/80">Kamis, 18 Sep 2025 • 2 Sesi Mengajar Aktif • 14 Koreksi Tugas</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="alert('Membuka Command Palette (Ctrl+K)...')" class="px-3 py-2 bg-teal-800 hover:bg-teal-700 text-white text-xs font-bold rounded-xl border border-teal-700 tactile-btn flex items-center gap-1.5">
                  <i data-lucide="command" class="w-3.5 h-3.5"></i>
                  <span>Quick Search (Ctrl+K)</span>
                </button>
                <button onclick="changeScreen('kelas')" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-extrabold rounded-xl tactile-btn shadow-md flex items-center gap-1.5">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                  <span>Mulai Sesi 8A</span>
                </button>
              </div>
            </div>

            <!-- Dense Metrics -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
              <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Sesi Hari Ini</span>
                <p class="text-xl font-extrabold text-slate-900">2 Kelas <span class="text-xs font-normal text-slate-500">(4 JP)</span></p>
                <span class="text-[10px] text-teal-700 font-semibold">8A (08:00) & 9B (10:30)</span>
              </div>
              <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Presensi Siswa</span>
                <p class="text-xl font-extrabold text-emerald-700">97.4% <span class="text-xs font-normal text-emerald-600">(31/32)</span></p>
                <span class="text-[10px] text-emerald-600 font-semibold">1 Siswa Izin Dokter</span>
              </div>
              <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Antrean Tugas</span>
                <p class="text-xl font-extrabold text-amber-700">14 Tugas</p>
                <span class="text-[10px] text-amber-700 font-semibold">Kuis Pythagoras</span>
              </div>
              <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase">PROSEM Status</span>
                <p class="text-xl font-extrabold text-teal-800">100% Seimbang</p>
                <span class="text-[10px] text-teal-700 font-semibold">32/32 JP Alokasi</span>
              </div>
            </div>

            <!-- Schedule & Quick Pills -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-2xs space-y-3">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h4 class="font-extrabold text-xs uppercase tracking-wider text-slate-900 flex items-center gap-1.5">
                  <i data-lucide="clock" class="w-4 h-4 text-teal-700"></i>
                  Linimasa Jadwal Mengajar Cepat
                </h4>
                <span class="text-xs text-slate-500">Kamis, 18 September 2025</span>
              </div>

              <div class="p-4 rounded-2xl bg-teal-50/70 border border-teal-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-teal-700 text-white font-extrabold flex items-center justify-center text-sm">8A</div>
                  <div>
                    <h5 class="font-bold text-xs text-slate-900">Matematika • Pertemuan #12 (Fase D SMP)</h5>
                    <p class="text-[11px] text-slate-600">Topik: Teorema Pythagoras & Puzzle Geometri • Ruang 2 (08:00 - 09:20)</p>
                  </div>
                </div>
                <button onclick="changeScreen('kelas')" class="px-4 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl font-extrabold text-xs tactile-btn flex items-center gap-1.5 self-start sm:self-auto">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                  <span>Buka Sesi Mengajar</span>
                </button>
              </div>
            </div>
          </div>
        `;
      } else if (activeScreen === 'aistudio') {
        return `
          <div class="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200 shadow-2xs space-y-5 animate-fadeIn">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <div>
                <h3 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                  <i data-lucide="wand-2" class="w-5 h-5 text-teal-700"></i>
                  Edu-OS AI Studio Generator (Gemini Fast)
                </h3>
                <p class="text-xs text-slate-500">Rancang RPP, Soal HOTS & Analisis Remedial terstruktur</p>
              </div>
              <button onclick="alert('Draf berhasil digenerate!')" class="px-4 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl text-xs font-bold tactile-btn flex items-center gap-1.5 shadow-xs">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>Generate via AI (Instan)</span>
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
              <div class="md:col-span-4 space-y-3 text-xs">
                <div>
                  <label class="font-bold text-slate-700 block mb-1">Mata Pelajaran & Fase</label>
                  <input type="text" value="Matematika - Fase D SMP" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-semibold">
                </div>
                <div>
                  <label class="font-bold text-slate-700 block mb-1">Topik Materi CP/TP</label>
                  <input type="text" value="Teorema Pythagoras dan Triple Pythagoras" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-semibold">
                </div>
                <div>
                  <label class="font-bold text-slate-700 block mb-1">Format Output</label>
                  <select class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-semibold">
                    <option>5 Soal HOTS Pilihan Ganda + Kunci & Pembahasan</option>
                    <option>Modul Ajar RPP 1 Lembar Standar Dinas</option>
                    <option>Rubrik Penilaian Kinerja Praktikum</option>
                  </select>
                </div>
              </div>

              <div class="md:col-span-8 bg-[#F6F8F8] p-4 rounded-2xl border border-slate-200 space-y-3 font-mono text-xs">
                <div class="flex items-center justify-between font-sans border-b border-slate-200 pb-2">
                  <span class="font-bold text-teal-900 text-xs uppercase">Preview Draf Soal Matematika (Fase D)</span>
                  <button onclick="alert('Teks disalin!')" class="text-[11px] text-teal-700 font-bold hover:underline">Salin Teks</button>
                </div>
                <div class="space-y-2 text-slate-700">
                  <p><strong>Soal 1 (C4):</strong> Sebuah segitiga siku-siku memiliki panjang sisi tegak 9 cm dan 12 cm. Tentukan panjang hipotenusa dan buktikan dengan rumus kuadrat!</p>
                  <p class="text-emerald-700 font-bold font-sans text-[11px]">💡 Kunci: c = √(9² + 12²) = √(81 + 144) = √225 = 15 cm.</p>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="space-y-5 animate-fadeIn">
            <!-- Workspace 4 Pills -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-2xs space-y-4">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-xl bg-teal-700 text-white font-extrabold flex items-center justify-center text-xs">8A</div>
                  <div>
                    <h3 class="font-extrabold text-sm text-slate-900">Kelas VIII-A • Matematika</h3>
                    <p class="text-[11px] text-slate-500">4 Ruang Kerja Terpadu (Mengajar, Nilai, Siswa, Administrasi)</p>
                  </div>
                </div>
                <button onclick="alert('Presensi Mode 1 Cepat dibuka!')" class="px-3.5 py-1.5 bg-emerald-600 text-white font-extrabold text-xs rounded-xl tactile-btn">
                  ⚡ Mode 1 Presensi Cepat (<10s)
                </button>
              </div>

              <!-- Freeze Column Table Preview -->
              <div class="overflow-x-auto custom-scrollbar border border-slate-200 rounded-2xl text-xs">
                <table class="w-full text-left border-collapse">
                  <thead class="bg-slate-50 border-b border-slate-200 text-slate-700 font-bold">

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassa Edu-OS - Master Interactive Prototype Seluruh Halaman Project</title>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            teal: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              200: '#99F6E4',
              300: '#5EEAD4',
              400: '#2DD4BF',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
              800: '#115E59',
              900: '#134E4A',
              950: '#042F2E',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F6F8F8;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.02);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(15,118,110,0.25);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(15,118,110,0.45);
    }
    .tactile-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-btn:active {
      transform: scale(0.97);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col custom-scrollbar overflow-x-hidden">

  <!-- ========================================================================= -->
  <!-- MAIN APPLICATION SHELL (SIDEBAR + TOP COMMAND BAR + PAGE BODY) -->
  <!-- ========================================================================= -->
  <div class="flex-1 flex flex-col md:flex-row min-h-screen">
    
    <!-- 1. MODERN EDU-OS SIDEBAR -->
    <aside class="w-full md:w-64 bg-white border-r border-slate-200/90 flex flex-col shrink-0 z-30">
      
      <!-- Brand & School Header -->
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-800 via-teal-700 to-teal-500 flex items-center justify-center text-white shadow-md shadow-teal-700/20">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-base tracking-tight text-slate-900">KLASSA</span>
              <span class="px-1.5 py-0.2 rounded text-[9px] font-extrabold uppercase bg-teal-100 text-teal-800 border border-teal-200">Edu-OS</span>
            </div>
            <p class="text-[10px] text-slate-500 font-medium truncate max-w-[130px]">SMPN 1 Nusantara</p>
          </div>

        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100">
          <i data-lucide="menu" class="w-5 h-5"></i>

      </div>

      <!-- Quick Command Bar Trigger -->
      <div class="px-3 pt-3">
        <button onclick="openCommandModal()" class="w-full px-3 py-2 bg-slate-50 hover:bg-teal-50/70 border border-slate-200 hover:border-teal-300 rounded-xl text-xs text-slate-500 flex items-center justify-between transition-all tactile-btn">
          <div class="flex items-center gap-2">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
            <span class="font-medium">Cari Cepat...</span>

          <button onclick="navTo('kelas-list')" id="nav-kelas-list" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="folders" class="w-4 h-4 text-teal-700"></i>
            <span>Daftar Kelas Binaan</span>
          </button>
          <button onclick="navTo('kelas-detail')" id="nav-kelas-detail" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">

            <span class="ml-auto w-2 h-2 rounded-full bg-emerald-500"></span>

          <button onclick="navTo('live-session')" id="nav-live-session" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2.5 transition-all tactile-btn text-emerald-700 hover:bg-emerald-50">

        <!-- Group 2: Akademik & Asesmen -->
        <div class="space-y-1">
          <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Kurikulum & Asesmen</span>
          <button onclick="navTo('akademik')" id="nav-akademik" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="calendar-range" class="w-4 h-4 text-teal-700"></i>
            <span>PROTA & PROSEM Engine</span>
          </button>
          <button onclick="navTo('quiz')" id="nav-quiz" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="help-circle" class="w-4 h-4 text-teal-700"></i>
            <span>Quiz & Ujian Online</span>

          <button onclick="navTo('assessment')" id="nav-assessment" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="award" class="w-4 h-4 text-teal-700"></i>
            <span>Buku Nilai & Tugas</span>
          </button>
          <button onclick="navTo('aistudio')" id="nav-aistudio" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2.5 transition-all tactile-btn text-indigo-700 hover:bg-indigo-50">
            <i data-lucide="wand-2" class="w-4 h-4 text-indigo-600"></i>
            <span>AI Studio Generator</span>
            <span class="ml-auto px-1.5 py-0.2 rounded bg-indigo-100 text-indigo-800 text-[9px]">AI</span>
          </button>
        </div>

        <!-- Group 3: Siswa & Komunikasi -->
        <div class="space-y-1">
          <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Siswa & Komunikasi</span>
          <button onclick="navTo('monitoring')" id="nav-monitoring" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="activity" class="w-4 h-4 text-teal-700"></i>
            <span>Monitoring 360° Siswa</span>
          </button>
          <button onclick="navTo('siswa')" id="nav-siswa" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="users" class="w-4 h-4 text-teal-700"></i>
            <span>Direktori Siswa</span>
          </button>
          <button onclick="navTo('parent')" id="nav-parent" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-emerald-700 hover:bg-emerald-50">
            <i data-lucide="message-square" class="w-4 h-4 text-emerald-600"></i>
            <span>Portal Orang Tua (WA)</span>
          </button>
        </div>

        <!-- Group 4: Sistem & Laporan -->
        <div class="space-y-1">
          <span class="px-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Dokumen & Sistem</span>
          <button onclick="navTo('laporan')" id="nav-laporan" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-teal-700"></i>
            <span>Pusat Rekap & Rapor</span>
          </button>
          <button onclick="navTo('pengaturan')" id="nav-pengaturan" class="sidebar-nav-item w-full px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2.5 transition-all tactile-btn text-slate-600 hover:bg-slate-100 hover:text-slate-900">
            <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i>
            <span>Pengaturan Sekolah</span>
          </button>
        </div>

      </div>

      <!-- User Profile Bar -->
      <div class="p-3 border-t border-slate-100 bg-slate-50/60 flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-teal-100 text-teal-800 font-bold flex items-center justify-center text-xs border border-teal-200 shrink-0">
            BS
          </div>
          <div class="truncate">
            <h5 class="text-xs font-bold text-slate-900 truncate">Budi Santoso, S.Pd.</h5>
            <p class="text-[10px] text-teal-700 font-semibold truncate">Wali Kelas VIII-A</p>
          </div>
        </div>
        <button onclick="alert('Keluar dari sesi...')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>

    </aside>

    <!-- 2. CONTENT AREA & TOP APP BAR -->
    <div class="flex-1 flex flex-col min-w-0">
      
      <!-- Top Command Bar -->
      <header class="h-16 glass-nav border-b border-slate-200/90 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4 sticky top-0 z-20">
        <!-- Breadcrumbs & Quick Page Indicator -->
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          <span class="text-xs font-extrabold text-slate-900 tracking-tight" id="page-title-breadcrumb">
            Beranda Guru (/hari-ini)
          </span>
          <span class="text-slate-300 hidden sm:inline">•</span>
          <span class="text-[11px] text-slate-500 hidden sm:inline">Semester Ganjil 2024/2025</span>
        </div>

        <!-- Right Quick Action Bar -->
        <div class="flex items-center gap-2">
          <button onclick="navTo('live-session')" class="px-3.5 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-xl text-xs font-extrabold shadow-xs tactile-btn flex items-center gap-1.5">
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
            <span class="hidden sm:inline">Mulai Sesi Mengajar</span>
          </button>
          <button onclick="navTo('aistudio')" class="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold tactile-btn flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">AI Studio</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main class="p-4 sm:p-6 lg:p-8 flex-1 space-y-6" id="eduos-page-container">

      </main>

    </div>

  </div>

  <!-- ========================================================================= -->
  <!-- COMMAND PALETTE MODAL (Ctrl + K) -->

  <div id="cmd-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-start justify-center pt-20 p-4 hidden">
    <div class="bg-white w-full max-w-xl rounded-3xl border border-slate-200 shadow-2xl overflow-hidden animate-fadeIn">
      <div class="p-3 border-b border-slate-100 flex items-center gap-3">
        <i data-lucide="search" class="w-4 h-4 text-teal-700"></i>
        <input type="text" id="cmd-search-input" oninput="filterCommandItems()" placeholder="Ketik nama siswa, kelas, jadwal, atau fitur... (contoh: '8A', 'Ahmad', 'PROSEM')" class="w-full bg-transparent border-none text-xs text-slate-800 placeholder-slate-400 focus:outline-none font-medium">
        <kbd class="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] text-slate-500 font-mono">ESC</kbd>
      </div>

      <div class="p-2 max-h-80 overflow-y-auto custom-scrollbar space-y-1" id="cmd-results-list">
        <button onclick="navTo('hari-ini'); closeCommandModal();" class="cmd-item w-full p-2.5 rounded-xl hover:bg-teal-50 text-left flex items-center justify-between text-xs text-slate-800 font-semibold transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="w-4 h-4 text-teal-700"></i>
            <span>Buka Beranda Guru</span>
          </div>
          <span class="text-[10px] text-slate-400">/hari-ini</span>
        </button>

        <button onclick="navTo('kelas-detail'); closeCommandModal();" class="cmd-item w-full p-2.5 rounded-xl hover:bg-teal-50 text-left flex items-center justify-between text-xs text-slate-800 font-semibold transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="book-open-check" class="w-4 h-4 text-teal-700"></i>
            <span>Kelas VIII-A (Matematika)</span>
          </div>
          <span class="text-[10px] text-slate-400">Workspace 4 Ruang Kerja</span>
        </button>

        <button onclick="navTo('akademik'); closeCommandModal();" class="cmd-item w-full p-2.5 rounded-xl hover:bg-teal-50 text-left flex items-center justify-between text-xs text-slate-800 font-semibold transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="calendar-range" class="w-4 h-4 text-teal-700"></i>
            <span>Perencanaan Kurikulum PROTA & PROSEM</span>
          </div>
          <span class="text-[10px] text-slate-400">Matriks Mingguan</span>
        </button>

        <button onclick="navTo('quiz'); closeCommandModal();" class="cmd-item w-full p-2.5 rounded-xl hover:bg-teal-50 text-left flex items-center justify-between text-xs text-slate-800 font-semibold transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="help-circle" class="w-4 h-4 text-teal-700"></i>
            <span>Quiz Online & Live Projector PIN</span>
          </div>
          <span class="text-[10px] text-slate-400">Bank Soal & Koreksi</span>
        </button>

        <button onclick="navTo('parent'); closeCommandModal();" class="cmd-item w-full p-2.5 rounded-xl hover:bg-teal-50 text-left flex items-center justify-between text-xs text-slate-800 font-semibold transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="message-square" class="w-4 h-4 text-emerald-600"></i>
            <span>Portal Orang Tua (WhatsApp Rekap)</span>
          </div>
          <span class="text-[10px] text-slate-400">Feed & Surat Sakit</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- JAVASCRIPT MASTER ROUTER & INTERACTIVE COMPONENTS ENGINE -->
  <!-- ========================================================================= -->
  <script>
    let activeRoute = 'hari-ini';

    // ROUTER MAP DEFINITIONS
    const ROUTE_LABELS = {
      'hari-ini': 'Beranda Guru (/hari-ini)',
      'kelas-list': 'Daftar Kelas Binaan (/kelas)',
      'kelas-detail': 'Workspace Kelas VIII-A (/kelas/8a)',
      'live-session': 'Mode 1: Live Teaching Session (/kelas/8a/pertemuan/12)',
      'akademik': 'Kurikulum & PROSEM Engine (/akademik)',
      'quiz': 'Quiz & Ujian Online (/quiz)',
      'assessment': 'Buku Nilai & Tugas (/assessment)',
      'aistudio': 'AI Studio Generator (/ai-studio)',
      'monitoring': 'Monitoring 360° Siswa (/monitoring)',
      'siswa': 'Direktori Siswa (/siswa)',
      'laporan': 'Pusat Rekap & Rapor (/laporan)',
      'parent': 'Portal Akses Orang Tua (/parent)',
      'pengaturan': 'Pengaturan Sekolah (/pengaturan)'
    };

    function navTo(routeId) {
      activeRoute = routeId;

      // Update breadcrumb
      document.getElementById('page-title-breadcrumb').innerText = ROUTE_LABELS[routeId] || routeId;

      // Update sidebar active classes
      document.querySelectorAll('.sidebar-nav-item').forEach(btn => {
        btn.classList.remove('active', 'bg-teal-700', 'text-white', 'shadow-xs');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100', 'hover:text-slate-900');
      });

      const currentNav = document.getElementById('nav-' + routeId);
      if (currentNav) {
        currentNav.classList.add('active', 'bg-teal-700', 'text-white', 'shadow-xs');
        currentNav.classList.remove('text-slate-600', 'hover:bg-slate-100', 'hover:text-slate-900');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentPage();
    }

    // DISPATCH PAGE RENDERER
    function renderCurrentPage() {
      const container = document.getElementById('eduos-page-container');

      if (activeRoute === 'hari-ini') {
        container.innerHTML = getPageHariIni();
      } else if (activeRoute === 'kelas-list') {
        container.innerHTML = getPageKelasList();
      } else if (activeRoute === 'kelas-detail') {
        container.innerHTML = getPageKelasDetail();
      } else if (activeRoute === 'live-session') {
        container.innerHTML = getPageLiveSession();
      } else if (activeRoute === 'akademik') {
        container.innerHTML = getPageAkademik();
      } else if (activeRoute === 'quiz') {
        container.innerHTML = getPageQuiz();
      } else if (activeRoute === 'assessment') {
        container.innerHTML = getPageAssessment();
      } else if (activeRoute === 'aistudio') {
        container.innerHTML = getPageAiStudio();
      } else if (activeRoute === 'monitoring') {
        container.innerHTML = getPageMonitoring();
      } else if (activeRoute === 'siswa') {
        container.innerHTML = getPageSiswa();
      } else if (activeRoute === 'laporan') {
        container.innerHTML = getPageLaporan();
      } else if (activeRoute === 'parent') {
        container.innerHTML = getPageParent();
      } else if (activeRoute === 'pengaturan') {
        container.innerHTML = getPagePengaturan();
      }

      lucide.createIcons();
    }

    // =========================================================================
    // PAGE 1: HARI INI (BERANDA GURU)
    // =========================================================================
    function getPageHariIni() {
      return `
        <div class="space-y-6 animate-fadeIn">
          <!-- Hero Banner -->
          <div class="bg-gradient-to-br from-teal-900 via-teal-800 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              <div class="space-y-2 max-w-2xl">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-500/20 border border-teal-400/30 text-teal-200 text-xs font-bold">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Kamis, 18 September 2025 • Pekan Efektif Ke-8
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Selamat Pagi, Pak Budi! ☕</h1>
                <p class="text-xs sm:text-sm text-teal-100/90">
                  Ada <strong class="underline">2 Sesi Mengajar</strong> hari ini dan <strong class="underline text-amber-300">14 Tugas Masuk</strong> yang siap Anda tinjau.
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="navTo('live-session')" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-xs rounded-xl shadow-md tactile-btn flex items-center gap-2">
                  <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                  <span>Mulai Sesi Kelas 8A</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 4 Metric Cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
            <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-1">
              <span class="text-[10px] font-bold text-slate-400 uppercase">Jadwal Mengajar</span>
              <p class="text-2xl font-extrabold text-slate-900">2 Sesi <span class="text-xs font-normal text-slate-500">(4 JP)</span></p>
              <p class="text-[11px] text-teal-700 font-semibold">Kelas 8A (08:00) & 9B (10:30)</p>
            </div>

    // =========================================================================
    // COMMAND PALETTE ENGINE (Ctrl+K)
    // =========================================================================
    function openCommandModal() {
      document.getElementById('cmd-modal').classList.remove('hidden');
      document.getElementById('cmd-search-input').focus();
    }

    function closeCommandModal() {
      document.getElementById('cmd-modal').classList.add('hidden');
    }

    function filterCommandItems() {
      const q = document.getElementById('cmd-search-input').value.toLowerCase();
      document.querySelectorAll('.cmd-item').forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(q)) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    }

    // SHORTCUT KEYBOARD LISTENER (Ctrl+K or Esc)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openCommandModal();
      }
      if (e.key === 'Escape') {
        closeCommandModal();
      }
    });

    // MOBILE SIDEBAR TOGGLE
    function toggleMobileSidebar() {
      const menu = document.getElementById('sidebar-menu');
      menu.classList.toggle('hidden');
    }

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app with OpenNext
        run: npm run build:pages
        env:
          NODE_VERSION: "22"
          BETTER_AUTH_SECRET: "os-teacher-secret-auth-key-2026"
          BETTER_AUTH_URL: "https://os-teacher.pages.dev"

# Derivasi Story Breakdown — spec-student-portal-auth
# 11 story — Tahap 1 dipecah 3 arah (1a/1b/1c, 2026-09-20); sisanya 1:1 dengan tahap. Urutan = urutan list.
- id: "1a"
  title: Fondasi Skema & Migrasi
  description: >-
    Migrasi aditif fondasi untuk seluruh spec (CAP-1…11): kolom akun Student,
    kode join Class, User.platformRole, dan model AuditLog sesuai N1/N4.
    Detail di stories/1a-schema-fondasi-migrasi.md.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    N1: semua kolom nullable/ber-default, nol drop/rename. N4: AuditLog
    append-only + index [actorId, createdAt] & [targetType, targetId];
    metadata wajib bebas PIN/hash/secret. joinCode String? @unique. SQL hasil
    wajib murni aditif. JANGAN jalankan migrate dev terhadap Neon maupun
    engine prisma-dev lokal (drift pra-existing → tuntutan RESET; P3005) —
    apply migrasi via db execute (Neon wajib direct URL tanpa -pooler) +
    migrate resolve --applied; prod via migrate deploy SETELAH migrasi
    rekonsiliasi drift (deferred-work) lunas.
- id: "1b"
  title: Primitif PIN Siswa (scrypt + pepper)
  description: >-
    Pure util hash/verify PIN 4-digit (CAP-1, primitif Story 3): scrypt
    constant-time, pepper PIN_PEPPER, aturan memori maxmem. Nol dependensi
    DB — paralel dengan 1a. Detail di stories/1b-primitif-pin.md.
  invoke_dev_with: >-
    Kontrak asimetris: hashPin throw PinFormatError pada input invalid,
    verifyPin return false (termasuk hash korup / param > maxmem). Pepper
    resolve saat module load, fail-fast production mirror getAuthSecret().
    Larangan meniru preseden plaintext QuizStudentAccess.pin/classroomPin.
    PIN_PEPPER wajib di env produksi sebelum deploy Story 3.
- id: "1c"
  title: Allowlist & Seeder Superadmin
  description: >-
    Jalur lahir superadmin satu-satunya (CAP-7): parser allowlist pure +
    seeder idempotent all-or-nothing dengan AuditLog. Prasyarat: 1a merged.
    Detail di stories/1c-allowlist-seeder-superadmin.md.
  invoke_dev_with: >-
    Validasi semua email dulu → satu transaksi all-or-nothing; cek
    emailVerified (abort default, --allow-unverified sadar); --dry-run +
    identitas DB target (host+dbname) selalu dicetak; normalisasi
    trim+lowercase; tsx devDependency + npm script seed:superadmin.
- id: "2"
  title: Gerbang Dedup Sekolah & Penguatan Alur Guru
  description: >-
    Menutup CAP-2 (gerbang dedup 4 skenario, searchSchools v2 nama/NPSN) dan
    CAP-3 (panel guru sekolah, notifikasi, revoke antar-guru, saklar sekolah
    aktif, edit NIS). Detail di execution-stages.md Tahap 2.
  invoke_dev_with: >-
    N2: backfill recompute School.normalizedName dengan normalisasi v2 (+alias
    smpn≡smp negeri) untuk baris lama — tanpa ini gerbang dedup (c)
    membandingkan format baru vs lama.
- id: "3"
  title: Mesin Autentikasi Siswa
  description: >-
    Membangun CAP-1: modul student-auth (hash/verify PIN, sesi terpisah,
    verifyStudentSession), actions registerStudent 4 cabang / loginStudent
    (+lockout) / logoutStudent, serta generate/rotasi/lock kode rombel.
    Detail di execution-stages.md Tahap 3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    GATE N3: backfill NIS kanonik (trim+uppercase) + laporan duplikat WAJIB
    selesai sebelum actions siswa aktif. B3: semua limiter persisten di DB
    (bukan in-memory) — per-akun 5x salah → kunci 15 mnt dengan eskalasi
    15m→1j→24j, per-IP+sekolah, kode rombel 10x/jam/IP; pesan error generik
    "NIS atau PIN salah" + dummy-verify agar timing seragam. B4:
    STUDENT_SESSION_SECRET fail-fast di production, tanpa fallback. Sesi siswa
    cookie terpisah klassa_student_session ko-eksis dengan sesi guru.
- id: "4"
  title: Portal Siswa Gelombang 1 & Integrasi Quiz
  description: >-
    Mewujudkan CAP-5 (dashboard harian, jadwal mingguan, profil & ganti PIN,
    layar pending, bottom nav 5 item) dan CAP-6 (quiz atas nama sesi → nilai
    otomatis di leger guru, riwayat & pembahasan). Detail di execution-stages.md
    Tahap 4 dan portal-modules.md Gelombang 1.
  done_checkpoint: true
  invoke_dev_with: >-
    B1: portal wajib action terpisah berbasis sesi (mis.
    startQuizAttemptFromSessionAction); studentId di-derive dari
    verifyStudentSession(), parameter identitas dari klien diabaikan
    sepenuhnya; signature startQuizAttemptAction lama TIDAK boleh berubah;
    accessMode CLASSROOM_PIN di-skip portal dengan kendali tetap via status
    PUBLISHED + validFrom + deadline (catat sebagai pengecualian disengaja di
    kode). N7: rantai E2E memuat langkah guru publish quiz sebelum siswa
    mengerjakan. Regresi nol: alur /q/[token] tetap hijau.
- id: "5"
  title: Panel Persetujuan Guru & Superadmin
  description: >-
    Menuntaskan CAP-4 dan CAP-7: panel siswa pending L1 per-rombel + L2
    sekolah-wide, approve/reject/batch, highlight eskalasi, pindah rombel;
    area /admin/* backstop superadmin ter-audit. Detail di execution-stages.md
    Tahap 5.
  invoke_dev_with: >-
    N5: pindah rombel = UPDATE classId pada row ClassStudent existing
    (menghormati @@unique([studentId, academicPeriodId])). N6: batch approve =
    $transaction atomic + laporan baris gagal + AuditLog per-baris. B2: reset
    PIN siswa HANYA pengampu rombel aktif/superadmin; approve L2 memicu
    notifikasi semua guru + AuditLog. B5: ban/reset password guru → revoke
    SEMUA sesi via revokeUserSessions (pasang admin plugin Better Auth di
    src/lib/auth.ts); nonaktif sekolah → semua login gagal + sesi
    di-invalidate + clear npsn.
- id: "6"
  title: Pengerasan, Rollover TA & Dokumentasi
  description: >-
    Menutup CAP-8: playbook rollover tahun ajaran (impor ulang roster, klaim
    ulang L0, NIS & PIN tetap), update MASTER_CONTEXT.md, smoke test dan review
    keamanan akhir. Detail di execution-stages.md Tahap 6.
  invoke_dev_with: >-
    N8: playbook rollover memuat langkah guru isi NIS siswa yang belum
    ber-NIS SEBELUM klaim ulang L0 (siswa tanpa NIS tidak punya jalur klaim).
    DoD: playbook tertulis, review keamanan lolos.
- id: "7"
  title: Student Progress (Gelombang 2)
  description: >-
    Mewujudkan CAP-9: pohon ketuntasan TP per mapel, nilai hanya FINAL,
    presensi rekap bulanan H/S/I/A, daftar tugas read-only, widget ketuntasan
    beranda. Detail di execution-stages.md Tahap 7 dan portal-modules.md
    Gelombang 2.
  spec_checkpoint: true
  invoke_dev_with: >-
    Nilai hanya FINAL kanonik (glossary.md): query wajib join Assessment
    (status COMPLETED) DAN AssessmentResult (status GRADED) — memfilter
    AssessmentResult saja tidak cukup. WAJIB keputusan open question ① (skor
    flat vs GradePolicy/KKTP) sebelum agregasi diimplementasi. Semua query
    di-scope ke periode aktif; unit test membuktikan nilai non-FINAL tidak
    bocor.
- id: "8"
  title: Submission, Materi & Mode Keluarga (Gelombang 3)
  description: >-
    Mewujudkan CAP-10: model AssignmentSubmission (teks/tautan) + antrean
    koreksi guru dengan umpan balik, materi belajar dari AiContentDraft
    publish, dan Mode Keluarga tab pantauan ortu read-only. Detail di
    execution-stages.md Tahap 8.
  invoke_dev_with: >-
    Submission teks/tautan dulu — unggah berkas out of scope. Mode Keluarga:
    reuse layanan baca parent, tanpa jalur tulis apa pun dari portal siswa.
- id: "9"
  title: AI Tutor & Gamifikasi (Gelombang 4)
  status: skipped
  skip_note: >-
    2026-09-24: Ditunda — checklist spec menulis "jika Tahap 9 dieksekusi"
    (opsional by design). CAP-11 belum terwujud; infra Gemini sudah ada
    sehingga bisa dieksekusi kapan pun. Go/no-go AI tutor + gamifikasi
    menunggu data pemakaian nyata portal.
  description: >-
    Mewujudkan CAP-11: AI tutor tanya-jawab terkurasi materi publish + TP guru
    dengan rate-limit dan audit log; gamifikasi mikro opsional. Detail di
    execution-stages.md Tahap 9 dan portal-modules.md Gelombang 4.
  done_checkpoint: true
  invoke_dev_with: >-
    Grounding ketat: AI hanya menjawab dalam konteks materi publish + TP guru;
    guardrail "AI membantu, guru menentukan". Gamifikasi mikro go/no-go
    berbasis data pemakaian nyata, bukan asumsi.
